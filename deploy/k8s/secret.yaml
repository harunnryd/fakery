apiVersion: v1
kind: Secret
metadata:
  name: twin-secrets
  namespace: fakery
  labels:
    app.kubernetes.io/name: twin-secrets
    app.kubernetes.io/component: config
stringData:
  DATABASE_URL: postgresql+asyncpg://twin:twin@postgres.fakery.svc.cluster.local:5432/twin
  REDIS_URL: redis://redis.fakery.svc.cluster.local:6379/0
  BLOB_ENDPOINT: http://minio.fakery.svc.cluster.local:9000
  BLOB_ACCESS_KEY: twin
  BLOB_SECRET_KEY: twin-secret
  CLOAKBROWSER_LICENSE_KEY: ""
  PROFILE_ENCRYPTION_KEY: ""
