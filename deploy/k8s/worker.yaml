apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fakery
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: bot-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: bot-worker
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: fakery:dev
          imagePullPolicy: IfNotPresent
          # Headed Chromium under a virtual framebuffer — the humanization
          # layer needs a real rendering path, not bare headless.
          command: ["sh", "-c", "Xvfb :99 -screen 0 1280x720x24 -nolisten tcp & sleep 2 && DISPLAY=:99 python -m twin.worker"]
          envFrom:
            - secretRef: {name: twin-secrets}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: BOT_IMAGE, value: fakery:dev}
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
