apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miniodata
  namespace: fakery
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: fakery
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: object-storage
    spec:
      containers:
        - name: minio
          image: minio/minio
          args: ["server", "/data"]
          env:
            - {name: MINIO_ROOT_USER, value: twin}
            - {name: MINIO_ROOT_PASSWORD, value: twin-secret}
          ports: [{containerPort: 9000}]
          volumeMounts:
            - {name: miniodata, mountPath: /data}
      volumes:
        - name: miniodata
          persistentVolumeClaim: {claimName: miniodata}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: fakery
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
spec:
  selector:
    app.kubernetes.io/name: minio
  ports: [{port: 9000, targetPort: 9000}]
