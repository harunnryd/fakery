# Run once per schema change (after building and loading the release digest):
#   just k8s-migrate
apiVersion: batch/v1
kind: Job
metadata:
  name: twin-migrate
  namespace: fakery
  labels:
    app.kubernetes.io/name: twin-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twin-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: fakery@sha256:42ee45b1c153268beb601690d95179f3b315d997c21bb46555fbe56d28be4988
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef: {name: twin-secrets}
