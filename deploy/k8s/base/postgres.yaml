apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: fakery
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fakery
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: twin}
            - {name: POSTGRES_PASSWORD, value: twin}
            - {name: POSTGRES_DB, value: twin}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "twin"]}
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim: {claimName: pgdata}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fakery
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports: [{port: 5432, targetPort: 5432}]
