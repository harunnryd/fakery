apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention
  namespace: fakery
  labels:
    app.kubernetes.io/name: retention
    app.kubernetes.io/component: retention
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: retention
            app.kubernetes.io/component: retention
        spec:
          restartPolicy: Never
          containers:
            - name: retention
              image: fakery@sha256:42ee45b1c153268beb601690d95179f3b315d997c21bb46555fbe56d28be4988
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "twin.retention"]
              envFrom:
                - secretRef: {name: twin-secrets}
