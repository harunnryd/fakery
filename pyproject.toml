[project]
name = "fakery"
version = "0.1.0"
description = "Fakery — AI twin meeting assistant for Google Meet, delivered as an API"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "minio>=7.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
browser = [
    "cloakbrowser==0.5.10",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["twin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]
